# Analyse SonarQube du job Jenkins digecc (ecc-devops) : projet, jeton et attente de la Quality Gate sont imposés par
# le pipeline. Couverture : tests Django (coverage.xml). Le JavaScript de recensement/static n'a pas encore de tests :
# il est analysé, sans mesure de couverture.
sonar.projectKey=digecc
sonar.projectName=DIGECC
sonar.sourceEncoding=UTF-8
sonar.sources=racine,recensement
sonar.tests=recensement
sonar.test.inclusions=recensement/tests/**
sonar.exclusions=**/migrations/**,**/__pycache__/**,recensement/data/**
sonar.coverage.exclusions=recensement/static/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
