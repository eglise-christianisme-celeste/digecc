# Fixed project name: volumes (database included) and network keep their ecc2026_* names whatever the
# folder or repository is called. The shared proxy (ecc-shield) and its certificates belong to
# ecc-infrastructure (project ecc-edge), never to this deployment.
name: ecc2026

services:
  personal:
    image: postgres:16.9-alpine
    container_name: ecc-personal
    restart: unless-stopped

    env_file:
      - .env.prod

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - personal_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    security_opt:
      - no-new-privileges:true

    networks:
      - ecc_network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    stop_grace_period: 30s

  volume_init:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: ecc-portal:latest
    container_name: ecc-volume-init

    user: root
    entrypoint: ["/bin/sh", "-c"]

    command:
      - |
        mkdir -p /app/media/paroisses /app/staticfiles

        chown -R eccparishatlast:eccparishatlast /app/media /app/staticfiles

        find /app/media -type d -exec chmod 755 {} \;
        find /app/media -type f -exec chmod 644 {} \;

        find /app/staticfiles -type d -exec chmod 755 {} \;
        find /app/staticfiles -type f -exec chmod 644 {} \;

    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media

    security_opt:
      - no-new-privileges:true

    restart: "no"

  portal:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: ecc-portal:latest
    container_name: ecc-portal

    restart: unless-stopped

    env_file:
      - .env.prod

    depends_on:
      personal:
        condition: service_healthy
      volume_init:
        condition: service_completed_successfully

    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media

    expose:
      - "8000"

    security_opt:
      - no-new-privileges:true

    networks:
      - ecc_network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  personal_data:
  static_data:
  media_data:

networks:
  # Shared with ecc-shield and CST: created once on the server, never removed by this deployment.
  ecc_network:
    name: ecc2026_ecc_network
    external: true

